<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MmHn v2 🎧</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08080c url('mmhn-background.png') center top/cover fixed no-repeat;color:#fff;font-family:Arial,sans-serif}
header{position:sticky;top:0;background:#0b0b10ee;backdrop-filter:blur(15px);z-index:5;padding:18px}
.wrap{max-width:1000px;margin:auto}.logo{font-size:30px;font-weight:900}.tag{color:#888;font-size:13px}
.search{display:flex;gap:8px;margin-top:15px}.search input{flex:1;background:#191921;border:1px solid #30303a;color:white;border-radius:14px;padding:14px;font-size:16px}.search button{border:0;border-radius:14px;padding:0 18px;font-weight:bold;cursor:pointer}
.tabs{display:flex;gap:8px;margin:18px 0}.tab{background:#191921;border:1px solid #30303a;color:#ddd;padding:10px 15px;border-radius:999px;cursor:pointer}.tab.active{background:white;color:black}
h2{margin-top:25px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card{background:#15151d;border:1px solid #282833;border-radius:18px;padding:14px}.cover{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;background:#24242e}.name{font-weight:bold;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{color:#999;margin-top:4px;font-size:13px}.actions{display:flex;gap:7px;margin-top:11px}.actions button{border:0;border-radius:10px;padding:9px 11px;cursor:pointer}.play{background:white}.fav{background:#292933;color:white}.empty{color:#888;padding:25px 0}
.player{position:fixed;bottom:0;left:0;right:0;background:#111117f5;border-top:1px solid #292933;backdrop-filter:blur(15px);z-index:10}.playerin{max-width:1000px;margin:auto;padding:10px 16px;display:grid;grid-template-columns:1fr auto 1fr;gap:15px;align-items:center}.now{min-width:0}.now b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now small{color:#999}.controls{display:flex;gap:8px}.controls button{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer}.main{background:white}.seek{width:100%;accent-color:white}.right{display:flex;align-items:center;gap:8px;justify-content:flex-end}.right span{font-size:12px;color:#999}@media(max-width:650px){.playerin{grid-template-columns:1fr auto}.right{grid-column:1/-1}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div style='position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:-1;pointer-events:none'></div><header><div class="wrap">
<div class="logo">MmHn 🎧</div><div class="tag">Music • Search • Playlists</div>
<div class="search"><input id="q" placeholder="Busca una canción o artista…"><button id="go">Buscar</button></div>
<div class="tabs"><button class="tab active" id="searchTab">Buscar</button><button class="tab" id="favTab">❤️ Favoritos</button></div>
</div></header>

<main class="wrap" style="padding:0 16px 150px">
<h2 id="heading">Descubre música</h2>
<div id="results" class="grid"><div class="empty">Busca un artista o canción para empezar.</div></div>
</main>

<div class="player"><div class="playerin">
<div class="now"><b id="nt">Nada reproduciendo</b><small id="na">MmHn</small></div>
<div class="controls"><button id="prev">⏮</button><button class="main" id="pp">▶</button><button id="next">⏭</button></div>
<div class="right"><span id="clock">0:00 / 0:00</span><input class="seek" id="seek" type="range" min="0" max="100" value="0"></div>
</div></div>
<audio id="audio"></audio>

<script>
const $=id=>document.getElementById(id), audio=$('audio');
let tracks=[], index=-1, favorites=JSON.parse(localStorage.getItem('mmhnFavs')||'[]'), showingFav=false;
window.favoriteObjects=JSON.parse(localStorage.getItem('mmhnFavObjects')||'{}');

$('go').onclick=search; $('q').onkeydown=e=>{if(e.key==='Enter')search()};
$('searchTab').onclick=()=>{showingFav=false;activate(false);renderFav()};
$('favTab').onclick=()=>{showingFav=true;activate(true);renderFav()};

function search(){
 const q=$('q').value.trim(); if(!q)return;
 showingFav=false; activate(false); $('heading').textContent='Resultados';
 $('results').innerHTML='<div class="empty">Buscando…</div>';
 const cb='mmhn_jsonp_'+Date.now();
 const script=document.createElement('script');
 let done=false;
 window[cb]=function(data){
  done=true;
  delete window[cb];
  script.remove();
  tracks=(data.results||[]).filter(x=>x.previewUrl);
  tracks.forEach(t=>{ window.favoriteObjects[String(t.trackId)]=t; });
  localStorage.setItem('mmhnFavObjects',JSON.stringify(window.favoriteObjects));
  render(tracks);
 };
 script.onerror=function(){
  if(done)return;
  delete window[cb];
  script.remove();
  $('results').innerHTML='<div class="empty">No se pudo buscar. Intenta otra vez.</div>';
 };
 script.src='https://itunes.apple.com/search?term='+encodeURIComponent(q)+'&country=US&media=music&entity=song&limit=40&callback='+cb;
 document.body.appendChild(script);
}
function render(list){
 $('results').innerHTML='';
 if(!list.length){$('results').innerHTML='<div class="empty">No encontré resultados con vista previa.</div>';return}
 list.forEach((t,i)=>{
  const c=document.createElement('div');c.className='card';
  const fav=favorites.includes(String(t.trackId));
  c.innerHTML=`<img class="cover" src="${t.artworkUrl100||''}"><div class="name">${esc(t.trackName)}</div><div class="artist">${esc(t.artistName)}</div><div class="actions"><button class="play">▶ Escuchar</button><button class="fav">${fav?'♥':'♡'}</button></div><a href="${t.trackViewUrl||'#'}" target="_blank" rel="noopener" style="display:block;margin-top:8px;color:#bbb;font-size:12px;text-decoration:none">Ver en Apple Music ↗</a>`;
  c.querySelector('.play').onclick=()=>playTrack(i,list);
  c.querySelector('.fav').onclick=()=>toggleFav(t);
  $('results').appendChild(c);
 });
}
function renderFav(){
 $('heading').textContent='Mis favoritos';
 const list=favorites.map(id=>favorites.find(x=>x===id)).map(id=>window.favoriteObjects?.[id]).filter(Boolean);
 if(list.length)render(list);else $('results').innerHTML='<div class="empty">Todavía no tienes favoritos. ❤️</div>';
}
function toggleFav(t){
 const id=String(t.trackId);
 window.favoriteObjects[id]=t;
 if(favorites.includes(id))favorites=favorites.filter(x=>x!==id);else favorites.push(id);
 localStorage.setItem('mmhnFavs',JSON.stringify(favorites));
 localStorage.setItem('mmhnFavObjects',JSON.stringify(window.favoriteObjects));
 render(showingFav?favorites.map(x=>window.favoriteObjects[x]).filter(Boolean):tracks);
}
function playTrack(i,list){
 tracks=list;index=i;const t=tracks[index];
 audio.src=t.previewUrl; $('nt').textContent=t.trackName;$('na').textContent=t.artistName;
 audio.play();
}
$('pp').onclick=()=>{if(audio.src)audio.paused?audio.play():audio.pause()};
$('next').onclick=()=>{if(tracks.length)playTrack((index+1)%tracks.length,tracks)};
$('prev').onclick=()=>{if(tracks.length)playTrack((index-1+tracks.length)%tracks.length,tracks)};
audio.onplay=()=>$('pp').textContent='⏸';audio.onpause=()=>$('pp').textContent='▶';
audio.onended=()=>$('next').click();
audio.ontimeupdate=()=>{if(audio.duration){$('seek').value=audio.currentTime/audio.duration*100;$('clock').textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration)}};
$('seek').oninput=()=>{if(audio.duration)audio.currentTime=$('seek').value/100*audio.duration};
function fmt(n){n=Math.floor(n||0);return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function activate(f){$('searchTab').classList.toggle('active',!f);$('favTab').classList.toggle('active',f)}
</script>
</body>
</html>
